api_platform:
    title: Urgence Tunisie API
    description: API de la plateforme multiservices d'urgence (Grand Tunis).
    version: 0.1.0
    formats:
        jsonld: ['application/ld+json']
        json: ['application/json']
    docs_formats:
        jsonld: ['application/ld+json']
        jsonopenapi: ['application/vnd.openapi+json']
        html: ['text/html']
    error_formats:
        jsonproblem: ['application/problem+json']
        jsonld: ['application/ld+json']
    patch_formats:
        json: ['application/merge-patch+json']
    defaults:
        stateless: true
        cache_headers:
            vary: ['Content-Type', 'Authorization', 'Origin']
    exception_to_status:
        # Transition refusée par la machine à états des demandes (§8.4).
        App\Domain\Request\InvalidRequestTransition: 409
        # Offre déjà réservée, expirée ou délai dépassé (§16.3, §16.5).
        App\Matching\OfferConflict: 409
        # Étape, devis, clôture ou avis impossible dans l'état de l'intervention (§6.6, §16.4).
        App\Intervention\InterventionConflict: 409
        # Vérification professionnelle impossible dans l'état actuel (§7.2).
        App\Domain\Professional\InvalidVerificationChange: 409
    swagger:
        api_keys:
            JWT:
                name: Authorization
                type: header
