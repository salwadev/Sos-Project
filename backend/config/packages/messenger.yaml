framework:
    messenger:
        failure_transport: failed

        transports:
            # Doctrine (table messenger_messages) : aucune infrastructure en plus de PostgreSQL.
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                retry_strategy:
                    max_retries: 3
                    delay: 1000
                    multiplier: 2
            failed: 'doctrine://default?queue_name=failed&auto_setup=0'
            sync: 'sync://'

        routing:
            # Diffusion d'une demande juste soumise (§5.8) : hors de la requête HTTP de création.
            'App\Matching\Message\DispatchServiceRequest': async

# En test, les messages « async » restent en mémoire : la réponse 201 reste SUBMITTED et chaque test
# décide quand les traiter (ApiTestCase::consumeAsyncMessages).
when@test:
    framework:
        messenger:
            transports:
                async: 'in-memory://'
                failed: 'in-memory://'
