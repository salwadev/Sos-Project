services:
  database:
    image: postgis/postgis:16-3.4
    container_name: sos_database
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sos}
      POSTGRES_USER: ${POSTGRES_USER:-sos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sos_dev_password}
      TZ: UTC
      PGTZ: UTC
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - database_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sos} -d ${POSTGRES_DB:-sos}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  database_data:
